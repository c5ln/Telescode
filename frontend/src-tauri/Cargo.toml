[package]
name = "telescode"
version = "0.1.0"
description = "Telescode desktop shell"
license = ""
repository = ""
edition = "2021"
rust-version = "1.79"

[lib]
name = "telescode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
