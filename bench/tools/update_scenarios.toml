# update_equiv.py 시나리오 — "update 결과 == 같은 코드를 새로 스캔한 결과" 검사용.
#
# [repos.<name>]
#   path    = 복사해 올 원본 (Telescode 루트 기준 상대경로). .py 파일만 복사한다.
#   files   = path 대신 합성 저장소: { "상대경로" = "내용" }
#   rescan_each_rep = true면 반복마다 DB를 복사하지 않고 다시 스캔한다 (DB가 커서 디스크가 모자란 경우).
#
# [[scenario]]
#   name, repo
#   class     = ordinary | big | hub | other (시간 목표 분류, 보고용)
#   target_ms = update 목표 시간 (없으면 보고만)
#   setup     = scan A 전에 적용하는 편집 (시작 상태 만들기)
#   edits     = scan A 뒤에 적용하는 편집
#   update    = A에 실행할 update 명령 (순서대로)
#
# 편집 op: replace(old, new[, count=1]) / append(text) / write(text) / remove / move(to)
#          remove_def(name; "Class.method" 가능) / add_method(class, text)
# update cmd: file(path) / files(paths) / delete(file_id) / rename(old, new)

[repos.xarray]
path = "bench/repos/xarray"

[repos.root]
path = "."
rescan_each_rep = true

[repos.syn]
[repos.syn.files]
"pkg/__init__.py" = ""
"pkg/core.py" = """
def thing():
    return 1


def other():
    return 2
"""
"pkg/alt.py" = """
def thing():
    return 3
"""
# re-export 사슬: main -> r1 -> r2 -> r3 -> r4 -> r5 -> core (6번 import, re-export 5단계)
"pkg/r1.py" = "from pkg.r2 import thing\n"
"pkg/r2.py" = "from pkg.r3 import thing\n"
"pkg/r3.py" = "from pkg.r4 import thing\n"
"pkg/r4.py" = "from pkg.r5 import thing\n"
"pkg/r5.py" = "from pkg.core import thing\n"
"pkg/chain_user.py" = """
from pkg.r1 import thing


def use_chain():
    return thing()
"""
"pkg/star_src.py" = """
def a():
    return 1


def _hidden():
    return 0
"""
"pkg/star_user.py" = """
from pkg.star_src import *


def use_star():
    a()
    b()
    _hidden()
"""
"pkg/glob.py" = """
def init():
    global helper
    from pkg.core import thing as helper


def use_global():
    return helper()
"""
"pkg/h.py" = """
def fh():
    return 1
"""
"pkg/same_line.py" = """
import pkg.h, pkg.i


def use_same_line():
    pkg.h.fh()
    pkg.i.fi()
"""
"pkg/fallback.py" = """
try:
    from pkg.fast import impl
except ImportError:
    from pkg.slow import impl


def use_fallback():
    return impl()
"""
"pkg/slow.py" = """
def impl():
    return "slow"
"""
"pkg/ext_user.py" = """
import extmod
import pkg.missing


def use_ext():
    extmod.go()
    pkg.missing.go()
"""
"pkg/base.py" = """
class Base:
    def run(self):
        return self.step()
"""
"pkg/child.py" = """
from pkg.base import Base


class Child(Base):
    def go(self):
        return self.hook()
"""

# 5단계 의존성 기록(ref_dep/fact) 겨냥: 편집은 다른 파일의 ref가 읽은 fact만 바꾸고,
# 그 ref가 있는 파일은 건드리지 않는다.
[repos.dep]
[repos.dep.files]
"dep/__init__.py" = ""
"dep/core.py" = """
def thing():
    return 1
"""
"dep/alt.py" = """
def thing():
    return 2
"""
# 2단계 star: user -> dep.outer(*) -> dep.inner(*)
"dep/inner.py" = """
def present():
    return 1
"""
"dep/outer.py" = "from dep.inner import *\n"
"dep/star_user.py" = """
from dep.outer import *


def use():
    present()
    later()
"""
# 3단 상속: C(B) -> B(A) -> A
"dep/ga.py" = """
class A:
    def base(self):
        return 0
"""
"dep/gb.py" = """
from dep.ga import A


class B(A):
    pass
"""
"dep/gc.py" = """
from dep.gb import B


class C(B):
    def go(self):
        return self.lifted()
"""
# 여러 파일이 공유하는 re-export 사슬: h1 -> h2 -> h3 -> h4 -> core
"dep/h1.py" = "from dep.h2 import thing\n"
"dep/h2.py" = "from dep.h3 import thing\n"
"dep/h3.py" = "from dep.h4 import thing\n"
"dep/h4.py" = "from dep.core import thing\n"
"dep/u1.py" = """
from dep.h1 import thing


def f1():
    thing()
    thing()


def f2():
    return thing()
"""
"dep/u2.py" = """
from dep import h1


def g1():
    h1.thing()


def g2():
    h1.thing()
"""
"dep/u3.py" = """
import dep.h2


def k1():
    dep.h2.thing()
"""
# Class.attr로 찾은 멤버
"dep/k.py" = """
class K:
    LIMIT = 3

    @classmethod
    def make(cls):
        return cls()

    def helper(self):
        return 1
"""
"dep/k_user.py" = """
from dep.k import K


def build():
    K.make()
    K.helper(None)
"""
# 두 표기로 import되는 모듈
"dep/sub/__init__.py" = ""
"dep/sub/mod.py" = """
def f():
    return 1
"""
"dep/sub/rel_user.py" = """
from . import mod
from .mod import f


def r():
    mod.f()
    f()
"""
"dep/abs_user.py" = """
import dep.sub.mod
from dep.sub import mod as m2


def a():
    dep.sub.mod.f()
    m2.f()
"""
# 같은 이름의 binding 두 개 (순서가 답을 정한다)
"dep/order.py" = """
from dep.alt import thing
from dep.core import thing
"""
"dep/order_user.py" = """
from dep.order import thing


def o():
    thing()
"""
"dep/moved.py" = """
from dep.core import thing
from dep.alt import thing as other
"""
"dep/moved_user.py" = """
from dep.moved import thing, other


def m():
    thing()
    other()
"""

